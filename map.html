<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Birthplace Map · Stable</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0a1620; color: #e0e0e0; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        .map-wrapper { flex: 3; position: relative; border-bottom: 3px solid #00d4ff; }
        #map { height: 100%; width: 100%; background: #1a2a3a; }
        .panel { flex: 1; background: #0f1a24; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        @media (min-width: 900px) {
            .app { flex-direction: row; }
            .map-wrapper { flex: 3; border-bottom: none; border-right: 3px solid #00d4ff; }
            .panel { flex: 1; min-width: 320px; }
        }
        .stats-card { background: linear-gradient(135deg, #1a2a3a, #0f1a24); border-radius: 24px; padding: 20px; text-align: center; border: 1px solid #00d4ff80; }
        .stats-number { font-size: 3.5rem; font-weight: bold; color: #00d4ff; }
        .qr-card { background: #16242e; border-radius: 20px; padding: 16px; text-align: center; }
        button { background: #00d4ff; border: none; padding: 10px 18px; border-radius: 40px; font-weight: 600; cursor: pointer; margin: 4px; }
        .recent-list { background: #0a141c; border-radius: 16px; padding: 12px; max-height: 200px; overflow-y: auto; }
        .recent-item { padding: 8px; border-bottom: 1px solid #1e2e3a; font-size: 0.85rem; display: flex; gap: 8px; align-items: center; }
        .status { font-size: 0.75rem; background: #0a141c; padding: 8px; border-radius: 16px; text-align: center; color: #00d4ff; }
        .refresh-badge { font-size: 0.7rem; color: #8aa0b0; text-align: center; margin-top: 8px; }
        h3 { font-size: 1rem; margin-bottom: 8px; color: #00d4ff; }
    </style>
</head>
<body>
<div class="app">
    <div class="map-wrapper"><div id="map"></div></div>
    <div class="panel">
        <div class="stats-card">
            <div class="stats-number" id="pinCount">0</div>
            <div class="stats-label">🌍 稳定标记 · 只增不减</div>
        </div>
        <div class="qr-card">
            <div style="font-weight: bold; margin-bottom: 6px;">📱 扫码提交</div>
            <div id="qrCodeContainer" style="background:white; padding:8px; border-radius:16px; display:inline-block;"></div>
            <div id="formLinkDisplay" style="font-size:0.7rem; margin-top:6px;"></div>
            <div class="refresh-badge">⚡ 实时 API + 持久化合并</div>
        </div>
        <div>
            <button id="exportBtn">📎 导出 Excel</button>
            <button id="refreshBtn">🔄 强制同步</button>
        </div>
        <div><h3>🕒 最近参与者</h3><div class="recent-list" id="recentList">加载中...</div></div>
        <div class="status" id="statusMsg">🟢 稳定模式 · 等待数据</div>
    </div>
</div>

<script>
    // ======================== 只改这里 ========================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5B8zEz9CPaF3HcUXaEhj82DFo5oZ3_Ln9p4xFUI2K87teyM4mSkMFsafP-hxR6vsMsw/exec";   // 例如: https://script.google.com/macros/s/xxx/exec
    const SUBMIT_PAGE_URL = "https://yz77-glitch.github.io/birthplace-map/submit.html";       // 例如: https://yz77-glitch.github.io/birthplace-map/submit.html
    // =========================================================

    let map = L.map('map').setView([30, 100], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let markerMap = new Map();      // key = "name|city|lat|lng"
    let markers = [];
    let currentList = [];

    async function fetchRealTimeData() {
        if (!SCRIPT_URL || SCRIPT_URL.includes("你的Apps")) {
            console.warn("请先配置 SCRIPT_URL");
            return null;
        }
        try {
            const url = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
            const res = await fetch(url, { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            console.log(`✅ API 返回 ${json.length} 条真实数据`);
            return json;
        } catch (e) {
            console.error("API 失败", e);
            return null;
        }
    }

    // 核心：只合并新数据，绝不删除现有标记
    function mergeNewData(records) {
        if (!records || !records.length) return false;

        let added = 0;
        for (let r of records) {
            const key = `${r.name}|${r.city}|${r.lat}|${r.lng}`;
            if (!markerMap.has(key)) {
                markerMap.set(key, { name: r.name, city: r.city, lat: r.lat, lng: r.lng, ts: Date.now() });
                added++;
            }
        }

        if (added === 0) return false;

        // 重新构建数组并按时间排序
        currentList = Array.from(markerMap.values()).sort((a,b) => a.ts - b.ts);
        return true;
    }

    function renderMapFromList(list) {
        // 清除旧 marker
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        for (let p of list) {
            const m = L.marker([p.lat, p.lng]).addTo(map);
            m.bindPopup(`<b>${escapeHtml(p.name)}</b><br>📍 ${escapeHtml(p.city)}`);
            markers.push(m);
        }

        const count = list.length;
        document.getElementById('pinCount').innerText = count;

        // 更新最近列表
        const recentDiv = document.getElementById('recentList');
        if (count === 0) {
            recentDiv.innerHTML = '✨ 等待第一个标记 ✨';
        } else {
            let html = '';
            list.slice().reverse().slice(0, 12).forEach(p => {
                html += `<div class="recent-item">📍 <strong>${escapeHtml(p.name)}</strong> · ${escapeHtml(p.city)}</div>`;
            });
            recentDiv.innerHTML = html;
        }

        // 地图闪烁效果
        const el = document.getElementById('map');
        el.style.boxShadow = '0 0 18px #00d4ff';
        setTimeout(() => el.style.boxShadow = '', 400);
    }

    async function syncAndMerge() {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.innerHTML = '🔄 稳定同步中 ...';
        const fresh = await fetchRealTimeData();
        if (fresh !== null) {
            const changed = mergeNewData(fresh);
            if (changed) {
                renderMapFromList(currentList);
                statusDiv.innerHTML = `✅ 已稳定同步 · 共 ${currentList.length} 个标记 · ${new Date().toLocaleTimeString()}`;
            } else {
                statusDiv.innerHTML = `🟢 已是最新 · ${currentList.length} 个标记 · ${new Date().toLocaleTimeString()}`;
            }
        } else {
            statusDiv.innerHTML = `⚠️ 请检查 Apps Script URL（需重新部署） · ${new Date().toLocaleTimeString()}`;
        }
    }

    function escapeHtml(str) {
        return String(str || '').replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    function exportToExcel() {
        if (!currentList.length) { alert('暂无数据'); return; }
        const ws = XLSX.utils.json_to_sheet(currentList);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Birthplaces');
        XLSX.writeFile(wb, `birthplace_stable_${new Date().toISOString().slice(0,19)}.xlsx`);
    }

    function setupQR() {
        if (SUBMIT_PAGE_URL && !SUBMIT_PAGE_URL.includes("你的submit.html")) {
            const qr = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(SUBMIT_PAGE_URL)}`;
            document.getElementById('qrCodeContainer').innerHTML = `<img src="${qr}" width="100" style="border-radius:12px;">`;
            document.getElementById('formLinkDisplay').innerHTML = `<a href="${SUBMIT_PAGE_URL}" target="_blank" style="color:#00d4ff;">📝 打开提交页面</a>`;
        } else {
            document.getElementById('qrCodeContainer').innerHTML = '⚠️ 请填写 SUBMIT_PAGE_URL';
        }
    }

    setupQR();
    // 启动后立刻同步一次
    syncAndMerge();
    // 每 3 秒拉一次最新数据（只增不删）
    setInterval(syncAndMerge, 3000);
    document.getElementById('exportBtn').onclick = exportToExcel;
    document.getElementById('refreshBtn').onclick = syncAndMerge;
</script>
</body>
</html>
