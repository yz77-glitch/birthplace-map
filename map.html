<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Birthplace Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a1620; color: #e0e0e0; }
        .app { display: flex; flex-direction: column; height: 100vh; }
        .map-wrapper { flex: 3; position: relative; border-bottom: 3px solid #00d4ff; }
        #map { height: 100%; width: 100%; background: #1a2a3a; }
        .panel { flex: 1; background: #0f1a24; padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        @media (min-width: 900px) { .app { flex-direction: row; } .map-wrapper { flex: 3; border-bottom: none; border-right: 3px solid #00d4ff; } .panel { flex: 1; } }
        .stats-card { background: linear-gradient(135deg, #1a2a3a 0%, #0f1a24 100%); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid rgba(0,212,255,0.3); }
        .stats-number { font-size: 3.5rem; font-weight: bold; color: #00d4ff; }
        .qr-card { background: #16242e; border-radius: 20px; padding: 16px; text-align: center; }
        button { background: #00d4ff; border: none; padding: 12px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; margin: 4px; }
        .recent-list { background: #0a141c; border-radius: 16px; padding: 12px; max-height: 200px; overflow-y: auto; }
        .recent-item { padding: 8px; border-bottom: 1px solid #1e2e3a; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        .status { font-size: 0.75rem; color: #00d4ff; text-align: center; padding: 8px; background: #0a141c; border-radius: 12px; }
        .refresh-indicator { font-size: 0.7rem; color: #a0b0c0; text-align: center; margin-top: 8px; }
        h3 { font-size: 1rem; margin-bottom: 12px; color: #00d4ff; }
    </style>
</head>
<body>
<div class="app">
    <div class="map-wrapper"><div id="map"></div></div>
    <div class="panel">
        <div class="stats-card">
            <div class="stats-number" id="pinCount">0</div>
            <div class="stats-label">🌍 Birthplaces Marked</div>
        </div>
        <div class="qr-card">
            <div style="font-size: 0.9rem; font-weight: bold; margin-bottom: 8px;">📱 SCAN TO JOIN</div>
            <div id="qrCodeContainer" style="background:white; padding:10px; border-radius:16px; display:inline-block;"></div>
            <div id="formLinkDisplay" style="font-size: 0.7rem; margin-top: 8px;"></div>
            <div class="refresh-indicator">🔄 Auto-refreshes every 3 seconds</div>
        </div>
        <div><button id="exportBtn">📎 Export to Excel</button><button id="refreshBtn">🔄 Force Refresh</button></div>
        <div><h3>🕒 Recent Participants</h3><div class="recent-list" id="recentList">Waiting for data...</div></div>
        <div class="status" id="statusMsg">🟡 Initializing...</div>
    </div>
</div>

<script>
    // ============================================================
    // 配置区域 - 只修改这两行
    // ============================================================
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBu-OgLZgei_VaCp9FaOf8fBvlsdCVyjXGB3J0BCAGdHTGwcaCmOe7ES3rO4o8vQAzEreYQJ-z4Vl7/pub?output=csv";
    const SUBMIT_PAGE_URL = "https://yz77-glitch.github.io/birthplace-map/submit.html";
    // ============================================================
    
    let map = L.map('map').setView([30.0, 100.0], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    
    let markers = [];
    let currentData = [];
    let lastDataHash = '';
    
    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current.trim());
        return result.map(v => v.replace(/^"|"$/g, ''));
    }
    
    async function fetchData() {
        try {
            // 添加时间戳强制刷新，完全禁用缓存
            const urlWithCacheBuster = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + Date.now();
            
            const response = await fetch(urlWithCacheBuster, { 
                cache: 'no-store',
                headers: { 
                    'Cache-Control': 'no-cache, no-store, must-revalidate',
                    'Pragma': 'no-cache',
                    'Expires': '0'
                }
            });
            
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const csvText = await response.text();
            if (csvText.length < 20) return [];
            
            const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length < 2) return [];
            
            const headers = parseCSVLine(lines[0]);
            
            // 查找列索引
            let nameIdx = -1, cityIdx = -1, latIdx = -1, lngIdx = -1;
            
            headers.forEach((h, idx) => {
                const lower = h.toLowerCase();
                if (lower.includes('name')) nameIdx = idx;
                if (lower.includes('city')) cityIdx = idx;
                if (lower.includes('lat')) latIdx = idx;
                if (lower.includes('lon') || lower.includes('lng')) lngIdx = idx;
            });
            
            if (nameIdx === -1) nameIdx = 1;
            if (cityIdx === -1) cityIdx = 2;
            if (latIdx === -1) latIdx = 3;
            if (lngIdx === -1) lngIdx = 4;
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                
                if (values.length > Math.max(nameIdx, cityIdx, latIdx, lngIdx)) {
                    const name = values[nameIdx];
                    const city = values[cityIdx];
                    const lat = parseFloat(values[latIdx]);
                    const lng = parseFloat(values[lngIdx]);
                    
                    if (name && city && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
                        data.push({ name, city, lat, lng, timestamp: Date.now() });
                    }
                }
            }
            
            return data;
            
        } catch (error) {
            console.error('Fetch error:', error);
            return [];
        }
    }
    
    function renderMarkers(data) {
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        data.forEach(item => {
            if (item.lat && item.lng && !isNaN(item.lat)) {
                const marker = L.marker([item.lat, item.lng]).addTo(map);
                marker.bindPopup(`<b>${escapeHtml(item.name)}</b><br>📍 ${escapeHtml(item.city)}`);
                markers.push(marker);
            }
        });
        
        document.getElementById('pinCount').innerText = data.length;
        
        const recentDiv = document.getElementById('recentList');
        if (data.length === 0) {
            recentDiv.innerHTML = 'No participants yet. Be the first! ✨';
        } else {
            recentDiv.innerHTML = data.slice().reverse().slice(0, 10).map(p => 
                `<div class="recent-item">📍 <strong>${escapeHtml(p.name)}</strong> from ${escapeHtml(p.city)}</div>`
            ).join('');
        }
    }
    
    function escapeHtml(str) {
        return String(str || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
    }
    
    async function refreshData() {
        const statusDiv = document.getElementById('statusMsg');
        statusDiv.innerHTML = '🔄 Fetching...';
        
        const newData = await fetchData();
        const newHash = JSON.stringify(newData.map(d => d.name + d.city + d.lat + d.lng));
        
        if (newHash !== lastDataHash && newData.length > 0) {
            currentData = newData;
            renderMarkers(currentData);
            lastDataHash = newHash;
            statusDiv.innerHTML = `✅ Updated: ${currentData.length} points | ${new Date().toLocaleTimeString()}`;
            
            // 视觉反馈
            const mapEl = document.getElementById('map');
            mapEl.style.boxShadow = '0 0 20px #00d4ff';
            setTimeout(() => mapEl.style.boxShadow = '', 300);
        } else if (newData.length === 0 && currentData.length === 0) {
            statusDiv.innerHTML = `🟢 Waiting for first submission... | ${new Date().toLocaleTimeString()}`;
        } else {
            statusDiv.innerHTML = `🟢 ${currentData.length} points | Last check: ${new Date().toLocaleTimeString()}`;
        }
    }
    
    function exportToExcel() {
        if (currentData.length === 0) { alert('No data to export'); return; }
        const ws = XLSX.utils.json_to_sheet(currentData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Birthplaces');
        XLSX.writeFile(wb, `birthplace_${new Date().toISOString().slice(0,19)}.xlsx`);
    }
    
    function setupQR() {
        if (SUBMIT_PAGE_URL && !SUBMIT_PAGE_URL.includes("YOUR_SUBMIT_PAGE_URL")) {
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(SUBMIT_PAGE_URL)}`;
            document.getElementById('qrCodeContainer').innerHTML = `<img src="${qrUrl}" width="100" height="100" style="border-radius:12px;">`;
            document.getElementById('formLinkDisplay').innerHTML = `<a href="${SUBMIT_PAGE_URL}" target="_blank" style="color:#00d4ff;">📝 Open Form to Submit</a>`;
        }
    }
    
    setupQR();
    refreshData();
    setInterval(refreshData, 3000);  // 3秒刷新一次，比之前更快
    document.getElementById('exportBtn').onclick = exportToExcel;
    document.getElementById('refreshBtn').onclick = refreshData;
</script>
</body>
</html>
